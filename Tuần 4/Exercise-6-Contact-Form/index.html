<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exercise 10 - Contact Form</title><link rel="stylesheet" href="style.css"></head><body><main class="contact-layout"><section class="intro"><span class="eyebrow">LET'S TALK</span><h1>Gửi lời nhắn cho mình</h1><p>Nếu bạn muốn trao đổi về một dự án hoặc góp ý giao diện, hãy điền thông tin vào biểu mẫu bên cạnh.</p><div class="contact-detail"><span>✉</span><div><b>Email</b><p>hieu@example.com</p></div></div><div class="contact-detail"><span>⌖</span><div><b>Thời gian phản hồi</b><p>Trong vòng 1–2 ngày học</p></div></div></section><form class="contact-form" action="#" method="get"><label for="name">Họ và tên</label><input id="name" name="name" type="text" placeholder="Nguyễn Văn A" required><label for="email">Email</label><input id="email" name="email" type="email" placeholder="ban@example.com" required><label for="topic">Chủ đề</label><select id="topic" name="topic"><option value="general">Trao đổi chung</option><option value="project">Dự án</option><option value="feedback">Góp ý</option></select><label for="message">Nội dung</label><textarea id="message" name="message" rows="5" placeholder="Bạn muốn chia sẻ điều gì?" required></textarea><button type="submit">Gửi tin nhắn <span>→</span></button><p class="form-note">Đây là form giao diện mẫu, chưa kết nối dịch vụ gửi email.</p></form></main></body></html>

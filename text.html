<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập JavaScript - Hoạt động 1 & 2</title>
</head>
<body>
    <h2>Bài tập Thực hành JavaScript</h2>
    <p>Nhấn <b>F12</b> và chuyển sang tab <b>Console</b> để xem kết quả của Hoạt động 1.</p>

    <script>
        // ==========================================
        // HOẠT ĐỘNG 1: "Hello JS Console"
        // ==========================================
        
        // 1. Khai báo tên và tuổi (Bạn sửa lại tên và tuổi của bạn nhé)
        let hoTen = "Tran Tan Tai";
        let tuoi = 20;

        console.log("=== KẾT QUẢ HOẠT ĐỘNG 1 ===");
        console.log("Họ và tên:", hoTen);
        console.log("Tuổi:", tuoi);

        // 2. Các phép toán cộng, trừ, nhân, chia
        let a = 20;
        let b = 5;
        console.log("Cộng (20 + 5):", a + b);
        console.log("Trừ (20 - 5):", a - b);
        console.log("Nhân (20 * 5):", a * b);
        console.log("Chia (20 / 5):", a / b);

        // 3. Vibe Coding: Giải thích tại sao '10' + 20 = '1020'
        /* 
           Giải thích: Trong JS, dấu '+' vừa là phép cộng số học, vừa là phép nối chuỗi.
           Vì '10' là kiểu chuỗi (String), JS tự động ép kiểu số 20 thành chuỗi '20' 
           và nối lại thành '1020'. Nếu muốn ra 30, dùng: Number('10') + 20.
        */
        console.log("Thử nghiệm '10' + 20:", '10' + 20);
        console.log("Sau khi ép kiểu Number('10') + 20:", Number('10') + 20);


        // ==========================================
        // HOẠT ĐỘNG 2: "Logic Builder" - Máy tính mini
        // ==========================================
        
        let nhapDiem = prompt("Nhập điểm số của bạn (thang điểm 10):");
        let diem = parseFloat(nhapDiem);

        if (isNaN(diem) || diem < 0 || diem > 10) {
            alert("Điểm nhập vào không hợp lệ! Vui lòng nhập số từ 0 đến 10.");
        } else if (diem > 8) {
            alert("Chúc mừng bạn đã đạt! -> Xếp loại: Giỏi");
        } else if (diem > 6.5) {
            alert("Chúc mừng bạn đã đạt! -> Xếp loại: Khá");
        } else if (diem >= 5) {
            alert("Chúc mừng bạn đã đạt! -> Xếp loại: Trung bình");
        } else {
            alert("Rất tiếc, hãy cố gắng hơn! -> Xếp loại: Yếu");
        }
    </script>
</body>
</html>
